<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发任务管理 - OpenClaw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* 布局 */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 左侧栏 - Agent */
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .logo-text {
            font-size: 16px;
            font-weight: 600;
        }
        
        .logo-sub {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* Agent 列表 */
        .agents-section {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding: 0 8px;
        }
        
        .agent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .agent-item:hover {
            background: var(--bg-hover);
        }
        
        .agent-item.active {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .agent-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .agent-info {
            flex: 1;
        }
        
        .agent-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .agent-role {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .agent-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .agent-status.idle { background: var(--text-secondary); }
        .agent-status.working { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        
        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 顶部 Header */
        .header {
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        
        .header-title {
            font-size: 16px;
            font-weight: 600;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        /* 统计 */
        .stats-bar {
            display: flex;
            gap: 24px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-num {
            font-size: 20px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .stat-item.total .stat-num { color: var(--accent-blue); }
        .stat-item.done .stat-num { color: var(--accent-green); }
        .stat-item.doing .stat-num { color: var(--accent-yellow); }
        .stat-item.pending .stat-num { color: var(--text-secondary); }
        
        /* 看板 */
        .board {
            flex: 1;
            overflow-x: auto;
            padding: 20px;
        }
        
        .board-scroll {
            display: flex;
            gap: 16px;
            height: 100%;
            min-width: max-content;
        }
        
        .board-column {
            width: 280px;
            min-width: 280px;
            background: var(--bg-card);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
        }
        
        .column-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .column-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .column-count {
            background: var(--bg-hover);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .column-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        /* 任务卡片 */
        .task-card {
            background: var(--bg-dark);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .task-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }
        
        .task-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .task-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .task-project {
            font-size: 11px;
            padding: 3px 8px;
            background: var(--bg-hover);
            border-radius: 6px;
            color: var(--text-secondary);
        }
        
        .task-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
        }
        
        .task-status.done {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }
        
        .task-status.doing {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
        }
        
        .task-status.pending {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-secondary);
        }
        
        /* 空状态 */
        .empty-column {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-header h2 {
            font-size: 18px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        /* 详情 */
        .detail-row {
            display: flex;
            margin-bottom: 16px;
        }
        
        .detail-label {
            width: 80px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .detail-value {
            flex: 1;
            font-size: 14px;
        }
        
        /* 时间线 */
        .timeline {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        
        .timeline-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .timeline-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-blue);
            margin-top: 6px;
            flex-shrink: 0;
        }
        
        .timeline-content {
            flex: 1;
        }
        
        .timeline-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .timeline-agent {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-blue);
        }
        
        .timeline-time {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .timeline-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        /* 列颜色标识 */
        .board-column[data-mode="新功能"] .column-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-blue); border-radius: 2px; }
        .board-column[data-mode="Bug修复"] .column-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-red); border-radius: 2px; }
        .board-column[data-mode="紧急热修"] .column-title::before { content: ''; width: 4px; height: 16px; background: #f97316; border-radius: 2px; }
        .board-column[data-mode="重构优化"] .column-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-purple); border-radius: 2px; }
        .board-column[data-mode="数据迁移"] .column-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-cyan); border-radius: 2px; }
        .board-column[data-mode="需求调研"] .column-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-yellow); border-radius: 2px; }
        .board-column[data-mode="其他"] .title:before { content: ''; width: 4px; height: 16px; background: var(--text-secondary); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 左侧 Agent 栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <div>
                        <div class="logo-text">OpenClaw</div>
                        <div class="logo-sub">任务管理系统</div>
                    </div>
                </div>
            </div>
            
            <div class="agents-section">
                <div class="section-title">🤖 Agents</div>
                <div id="agents-list">
                    <!-- Agent 列表由 JS 渲染 -->
                </div>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main">
            <!-- 顶部 Header -->
            <header class="header">
                <div class="header-title">📋 任务看板</div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="refreshData()">🔄 刷新</button>
                    <button class="btn btn-primary">+ 新建任务</button>
                </div>
            </header>
            
            <!-- 统计栏 -->
            <div class="stats-bar">
                <div class="stat-item total">
                    <span class="stat-num" id="stat-total">0</span>
                    <span class="stat-label">总任务</span>
                </div>
                <div class="stat-item done">
                    <span class="stat-num" id="stat-done">0</span>
                    <span class="stat-label">已完成</span>
                </div>
                <div class="stat-item doing">
                    <span class="stat-num" id="stat-doing">0</span>
                    <span class="stat-label">进行中</span>
                </div>
                <div class="stat-item pending">
                    <span class="stat-num" id="stat-pending">0</span>
                    <span class="stat-label">待处理</span>
                </div>
            </div>
            
            <!-- 看板 -->
            <div class="board">
                <div class="board-scroll" id="board">
                    <!-- 看板列由 JS 渲染 -->
                </div>
            </div>
        </main>
    </div>
    
    <!-- 任务详情弹窗 -->
    <div class="modal" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">任务详情</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
            </div>
        </div>
    </div>

    <script>
        // Gist 配置
        const GIST_ID = '96e9f660411102536b60b781b392f01d';
        
        // Agent 定义
        const AGENTS = [
            { id: 'main', name: 'K', role: '主助手', color: '#3b82f6' },
            { id: 'productmanager', name: 'PM', role: '产品经理', color: '#10b981' },
            { id: 'architect', name: 'Arch', role: '架构师', color: '#8b5cf6' },
            { id: 'backdev', name: 'Backend', role: '后端开发', color: '#f59e0b' },
            { id: 'frontdev', name: 'Frontend', role: '前端开发', color: '#06b6d4' },
            { id: 'reviewer', name: 'Reviewer', role: '代码评审', color: '#ef4444' },
            { id: 'tester', name: 'Tester', role: '测试', color: '#ec4899' }
        ];
        
        // 看板列
        const COLUMNS = [
            { id: 'new-feature', title: '🚀 新功能', mode: '新功能' },
            { id: 'bug-fix', title: '🐛 Bug修复', mode: 'Bug修复' },
            { id: 'hotfix', title: '🔥 紧急热修', mode: '紧急热修' },
            { id: 'refactor', title: '♻️ 重构优化', mode: '重构优化' },
            { id: 'migration', title: '🗄️ 数据迁移', mode: '数据迁移' },
            { id: 'research', title: '🔬 需求调研', mode: '需求调研' },
            { id: 'other', title: '📌 其他', mode: '其他' }
        ];
        
        let tasks = [];
        
        // 加载任务
        function loadTasks() {
            fetch(`https://api.github.com/gists/${GIST_ID}`)
                .then(res => res.json())
                .then(gist => {
                    const content = gist.files['tasks.json'].content;
                    tasks = JSON.parse(content);
                    renderAll();
                })
                .catch(err => {
                    console.error('加载失败:', err);
                });
        }
        
        // 渲染全部
        function renderAll() {
            renderStats();
            renderAgents();
            renderBoard();
        }
        
        // 渲染统计
        function renderStats() {
            const total = tasks.length;
            const done = tasks.filter(t => t.status === 'done').length;
            const doing = tasks.filter(t => t.status && t.status !== 'done' && t.status !== 'pending').length;
            const pending = tasks.filter(t => !t.status || t.status === 'pending').length;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-doing').textContent = doing;
            document.getElementById('stat-pending').textContent = pending;
        }
        
        // 渲染 Agent
        function renderAgents() {
            // 分析任务确定 Agent 状态
            const agentWorking = {};
            
            tasks.forEach(task => {
                if (task.reports) {
                    const lastReport = task.reports[task.reports.length - 1];
                    if (lastReport && task.status !== 'done') {
                        agentWorking[lastReport.agent] = true;
                    }
                }
            });
            
            const html = AGENTS.map(agent => {
                const isWorking = agentWorking[agent.id];
                return `
                    <div class="agent-item ${isWorking ? 'active' : ''}">
                        <div class="agent-avatar" style="background: ${agent.color}20; color: ${agent.color}">
                            ${agent.name.charAt(0)}
                        </div>
                        <div class="agent-info">
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-role">${agent.role}</div>
                        </div>
                        <div class="agent-status ${isWorking ? 'working' : 'idle'}"></div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('agents-list').innerHTML = html;
        }
        
        // 渲染看板
        function renderBoard() {
            const html = COLUMNS.map(col => {
                const colTasks = tasks.filter(t => {
                    const mode = (t.mode || '其他');
                    return mode === col.mode;
                });
                
                const cards = colTasks.map(task => {
                    const statusClass = task.status === 'done' ? 'done' : (task.status === 'pending' || !task.status ? 'pending' : 'doing');
                    const statusText = task.status === 'done' ? '已完成' : (task.status === 'pending' || !task.status ? '待处理' : '进行中');
                    
                    return `
                        <div class="task-card" onclick="showTask('${task.id}')">
                            <div class="task-title">${task.name}</div>
                            <div class="task-meta">
                                <span class="task-project">${task.project || '-'}</span>
                                <span class="task-status ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                    `;
                }).join('');
                
                const emptyHtml = colTasks.length === 0 ? '<div class="empty-column">暂无任务</div>' : '';
                
                return `
                    <div class="board-column" data-mode="${col.mode}">
                        <div class="column-header">
                            <span class="column-title">${col.title}</span>
                            <span class="column-count">${colTasks.length}</span>
                        </div>
                        <div class="column-body">
                            ${cards}
                            ${emptyHtml}
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('board').innerHTML = html;
        }
        
        // 显示任务详情
        function showTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            document.getElementById('modal-title').textContent = task.name;
            
            const reports = task.reports || [];
            const timeline = reports.map(r => `
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-header">
                            <span class="timeline-agent">${r.agent}</span>
                            <span class="timeline-time">${r.time}</span>
                        </div>
                        <div class="timeline-text">${r.content}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('modal-body').innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">项目</span>
                    <span class="detail-value">${task.project || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">模式</span>
                    <span class="detail-value">${task.mode || '其他'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">分支</span>
                    <span class="detail-value">${task.branch || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">描述</span>
                    <span class="detail-value">${task.description || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">创建</span>
                    <span class="detail-value">${task.createdAt || '-'}</span>
                </div>
                ${timeline ? `<div class="timeline"><div class="timeline-title">📝 执行记录</div>${timeline}</div>` : '<div style="color: var(--text-secondary); margin-top: 20px;">暂无记录</div>'}
            `;
            
            document.getElementById('task-modal').classList.add('show');
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('task-modal').classList.remove('show');
        }
        
        // 刷新数据
        function refreshData() {
            loadTasks();
        }
        
        // 关闭弹窗事件
        document.getElementById('task-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        // 初始化
        loadTasks();
        
        // 自动刷新
        setInterval(loadTasks, 30000);
    </script>
</body>
</html>
