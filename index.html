<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发任务管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --bg-gradient-alt: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --bg-card: rgba(255, 255, 255, 0.95);
            --border: rgba(255, 255, 255, 0.2);
            --border-light: rgba(0, 0, 0, 0.08);
            --accent: #667eea;
            --accent-green: #38ef7d;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text: #1f2937;
            --text-dim: #6b7280;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.16);
            --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 32px;
            line-height: 1.6;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            margin-bottom: 28px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideDown 0.5s ease-out;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .stats {
            display: flex;
            gap: 32px;
        }
        
        .stat {
            text-align: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }
        
        .stat:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        
        .stat-num {
            font-size: 32px;
            font-weight: 800;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .agents {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .agent-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        
        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--bg-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .agent-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }
        
        .agent-card:hover::before {
            transform: scaleX(1);
        }
        
        .agent-card.offline {
            opacity: 0.5;
        }
        
        .agent-icon {
            font-size: 36px;
            margin-bottom: 10px;
            display: block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        .agent-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }
        
        .agent-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        
        .agent-status.working {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: var(--accent-yellow);
        }
        
        .agent-status.idle {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #059669;
        }
        
        .agent-status.offline {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: var(--accent-red);
        }
        
        .board {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 24px;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }
        
        .column {
            min-width: 280px;
            max-width: 280px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            flex-shrink: 0;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .column:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .column-header {
            padding: 18px 20px;
            border-bottom: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(139, 92, 246, 0.05));
        }
        
        .column-header h3 {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .column.todo .column-header { 
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(252, 165, 165, 0.1));
            border-bottom-color: var(--accent-red);
        }
        .column.todo .column-header h3 { color: var(--accent-red); }
        
        .column.dev .column-header { 
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(139, 92, 246, 0.1));
            border-bottom-color: var(--accent);
        }
        .column.dev .column-header h3 { color: var(--accent); }
        
        .column.review .column-header { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(251, 191, 36, 0.1));
            border-bottom-color: var(--accent-yellow);
        }
        .column.review .column-header h3 { color: var(--accent-yellow); }
        
        .column.test .column-header { 
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
            border-bottom-color: var(--accent-purple);
        }
        .column.test .column-header h3 { color: var(--accent-purple); }
        
        .column.done .column-header { 
            background: linear-gradient(135deg, rgba(56, 239, 125, 0.1), rgba(16, 185, 129, 0.1));
            border-bottom-color: var(--accent-green);
        }
        .column.done .column-header h3 { color: #059669; }
        
        .task-count {
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: var(--bg-gradient);
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .column-body {
            padding: 16px;
            min-height: 280px;
            max-height: calc(100vh - 380px);
            overflow-y: auto;
        }
        
        .column-body::-webkit-scrollbar {
            width: 6px;
        }
        
        .column-body::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }
        
        .column-body::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
        
        .task {
            background: linear-gradient(135deg, #ffffff, #f9fafb);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        
        .task::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--bg-gradient);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }
        
        .task:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        
        .task:hover::before {
            transform: scaleY(1);
        }
        
        .task-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.5;
            color: var(--text);
        }
        
        .task-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .task-project {
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-gradient);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .task-date {
            font-size: 12px;
            color: var(--text-dim);
        }
        
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 13px;
        }
        
        .empty::before {
            content: '📭';
            display: block;
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            width: 95%;
            max-width: 720px;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(139, 92, 246, 0.05));
        }
        
        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-close:hover { 
            color: var(--text);
            background: rgba(0, 0, 0, 0.05);
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }
        
        .detail-section {
            margin-bottom: 28px;
        }
        
        .detail-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        
        .detail-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        
        .report-item {
            background: linear-gradient(135deg, #fafafa, #f3f4f6);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent-purple);
            transition: all 0.2s ease;
        }
        
        .report-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .report-agent {
            font-weight: 700;
            font-size: 13px;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .report-time {
            font-size: 12px;
            color: var(--text-dim);
        }
        
        .report-content {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .timeline {
            border-left: 3px solid var(--accent);
            padding-left: 24px;
            margin-left: 8px;
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -29px;
            top: 4px;
            width: 14px;
            height: 14px;
            background: var(--bg-gradient);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }
        
        .timeline-item::after {
            content: '';
            position: absolute;
            left: -24px;
            top: 22px;
            width: 4px;
            height: calc(100% + 4px);
            background: linear-gradient(to bottom, var(--accent), transparent);
        }
        
        .timeline-item:last-child::after {
            display: none;
        }
        
        .timeline-time {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .timeline-action {
            font-size: 14px;
            font-weight: 500;
        }
        
        @media (max-width: 900px) {
            body { padding: 16px; }
            .header { flex-direction: column; gap: 20px; padding: 20px; }
            .stats { gap: 16px; }
            .agents { grid-template-columns: repeat(3, 1fr); }
            .column { min-width: 260px; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>开发任务管理系统</h1>
        <div class="stats">
            <div class="stat"><div class="stat-num" id="total">0</div><div class="stat-label">总任务</div></div>
            <div class="stat"><div class="stat-num" id="doing">0</div><div class="stat-label">进行中</div></div>
            <div class="stat"><div class="stat-num" id="completed">0</div><div class="stat-label">已完成</div></div>
        </div>
    </header>
    
    <section class="agents" id="agents"></section>
    
    <div class="board">
        <div class="column todo">
            <div class="column-header"><h3>○ 待开发</h3><span class="task-count" id="todo-count">0</span></div>
            <div class="column-body" id="todo"></div>
        </div>
        <div class="column dev">
            <div class="column-header"><h3>○ 开发中</h3><span class="task-count" id="dev-count">0</span></div>
            <div class="column-body" id="dev"></div>
        </div>
        <div class="column review">
            <div class="column-header"><h3>○ 待审查</h3><span class="task-count" id="review-count">0</span></div>
            <div class="column-body" id="review"></div>
        </div>
        <div class="column test">
            <div class="column-header"><h3>○ 待测试</h3><span class="task-count" id="test-count">0</span></div>
            <div class="column-body" id="test"></div>
        </div>
        <div class="column done">
            <div class="column-header"><h3>○ 已完成</h3><span class="task-count" id="done-count">0</span></div>
            <div class="column-body" id="done"></div>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Detail</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        const AGENTS = [
            { id: 'main', name: '总指挥', icon: '🎯' },
            { id: 'productmanager', name: '产品经理', icon: '📋' },
            { id: 'architect', name: '架构师', icon: '🏗️' },
            { id: 'backdev', name: '后端开发', icon: '⚙️' },
            { id: 'frontdev', name: '前端开发', icon: '🎨' },
            { id: 'reviewer', name: '代码审查', icon: '🔍' },
            { id: 'tester', name: '测试工程', icon: '🧪' }
        ];
        
        let tasks = [];
        
        function getAgentTasks() {
            const map = {};
            tasks.forEach(task => {
                if (task.reports && task.reports.length > 0) {
                    const last = task.reports[task.reports.length - 1];
                    if (last && last.agent) {
                        if (!map[last.agent]) map[last.agent] = [];
                        map[last.agent].push(task);
                    }
                }
            });
            return map;
        }
        
        function renderAgents() {
            const map = getAgentTasks();
            const container = document.getElementById('agents');
            
            container.innerHTML = AGENTS.map(agent => {
                const agentTasks = map[agent.id] || [];
                let status = 'idle', statusText = '空闲';
                
                if (agentTasks.length > 0) {
                    const task = agentTasks[0];
                    if (['dev', 'review', 'test'].includes(task.status)) {
                        status = 'working';
                        statusText = '工作中';
                    } else if (task.status === 'done') {
                        statusText = '已完成';
                    }
                }
                
                return `
                    <div class="agent-card" onclick="showAgentDetail('${agent.id}')">
                        <div class="agent-icon">${agent.icon}</div>
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-status ${status}">${statusText}</div>
                    </div>
                `;
            }).join('');
        }
        
        function showAgentDetail(agentId) {
            const agent = AGENTS.find(a => a.id === agentId);
            const map = getAgentTasks();
            const agentTasks = map[agentId] || [];
            
            let html = `<div class="detail-section">
                <div class="detail-title">Agent 信息</div>
                <div class="detail-grid">
                    <div><div class="detail-label">名称</div><div class="detail-value">${agent.icon} ${agent.name}</div></div>
                    <div><div class="detail-label">任务数</div><div class="detail-value">${agentTasks.length}</div></div>
                </div>
            </div>`;
            
            if (agentTasks.length > 0) {
                html += `<div class="detail-section"><div class="detail-title">任务列表</div>`;
                agentTasks.forEach(task => {
                    html += `<div class="report-item" onclick="showTaskDetail(${task.id})" style="cursor:pointer">
                        <div class="report-header">
                            <span class="report-agent">#${task.id}</span>
                            <span class="report-time">${task.status}</span>
                        </div>
                        <div class="report-content">${task.name}</div>
                    </div>`;
                });
                html += `</div>`;
            }
            
            document.getElementById('modal-title').textContent = `Agent: ${agent.name}`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }
        
        // Gist 配置
        const GIST_ID = '96e9f660411102536b60b781b392f01d';
        
        function loadTasks() {
            // 优先从 GitHub Gist 获取数据
            fetch(`https://api.github.com/gists/${GIST_ID}`)
                .then(res => res.json())
                .then(gist => {
                    const content = gist.files['tasks.json'].content;
                    tasks = JSON.parse(content);
                    renderBoard();
                    renderAgents();
                    updateStats();
                })
                .catch(err => {
                    // 降级到本地文件
                    fetch('data/tasks.json')
                        .then(res => res.json())
                        .then(data => {
                            tasks = data;
                            renderBoard();
                            renderAgents();
                            updateStats();
                        });
                });
        }
        
        function renderBoard() {
            const cols = {
                'todo': document.getElementById('todo'),
                'dev': document.getElementById('dev'),
                'review': document.getElementById('review'),
                'test': document.getElementById('test'),
                'done': document.getElementById('done')
            };
            
            Object.keys(cols).forEach(status => {
                const el = cols[status];
                const filtered = tasks.filter(t => t.status === status);
                
                if (filtered.length === 0) {
                    el.innerHTML = '<div class="empty">暂无任务</div>';
                } else {
                    el.innerHTML = filtered.map(task => `
                        <div class="task" onclick="showTaskDetail(${task.id})">
                            <div class="task-name">${task.name}</div>
                            <div class="task-meta">
                                ${task.project ? `<span class="task-project">${task.project}</span>` : ''}
                                <span class="task-date">${task.createdAt}</span>
                            </div>
                        </div>
                    `).join('');
                }
            });
        }
        
        function updateStats() {
            document.getElementById('total').textContent = tasks.length;
            document.getElementById('doing').textContent = tasks.filter(t => ['dev', 'review', 'test'].includes(t.status)).length;
            document.getElementById('completed').textContent = tasks.filter(t => t.status === 'done').length;
            document.getElementById('todo-count').textContent = tasks.filter(t => t.status === 'todo').length;
            document.getElementById('dev-count').textContent = tasks.filter(t => t.status === 'dev').length;
            document.getElementById('review-count').textContent = tasks.filter(t => t.status === 'review').length;
            document.getElementById('test-count').textContent = tasks.filter(t => t.status === 'test').length;
            document.getElementById('done-count').textContent = tasks.filter(t => t.status === 'done').length;
        }
        
        function showTaskDetail(taskId) {
            const task = tasks.find(t => t.id == taskId);
            if (!task) return;
            
            let html = `<div class="detail-section">
                <div class="detail-title">任务详情</div>
                <div class="detail-grid">
                    <div><div class="detail-label">ID</div><div class="detail-value">#${task.id}</div></div>
                    <div><div class="detail-label">状态</div><div class="detail-value">${task.status}</div></div>
                    <div><div class="detail-label">项目</div><div class="detail-value">${task.project || '-'}</div></div>
                    <div><div class="detail-label">创建时间</div><div class="detail-value">${task.createdAt}</div></div>
                    ${task.branch ? `<div><div class="detail-label">分支</div><div class="detail-value">${task.branch}</div></div>` : ''}
                </div>
            </div>`;
            
            if (task.description) {
                html += `<div class="detail-section">
                    <div class="detail-title">描述</div>
                    <div class="report-content">${task.description}</div>
                </div>`;
            }
            
            if (task.reports && task.reports.length > 0) {
                html += `<div class="detail-section"><div class="detail-title">汇报记录</div>`;
                const agentNameMap = { 'main': '总指挥', 'productmanager': '产品经理', 'architect': '架构师', 'backdev': '后端开发', 'frontdev': '前端开发', 'reviewer': '代码审查', 'tester': '测试工程' };
                task.reports.forEach(r => {
                    const agentName = agentNameMap[r.agent] || r.agent;
                    html += `<div class="report-item">
                        <div class="report-header">
                            <span class="report-agent">${agentName}</span>
                            <span class="report-time">${r.time}</span>
                        </div>
                        <div class="report-content">${r.content}</div>
                    </div>`;
                });
                html += `</div>`;
            }
            
            if (task.timeline && task.timeline.length > 0) {
                html += `<div class="detail-section"><div class="detail-title">时间线</div><div class="timeline">`;
                task.timeline.forEach(item => {
                    html += `<div class="timeline-item">
                        <div class="timeline-time">${item.time}</div>
                        <div class="timeline-action">${item.action}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }
            
            document.getElementById('modal-title').textContent = `Task #${task.id}`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        document.getElementById('modal').addEventListener('click', e => {
            if (e.target.id === 'modal') closeModal();
        });
        
        loadTasks();
    </script>
</body>
</html>
