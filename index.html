<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发任务管理 - OpenClaw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* 美化滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
        
        /* 布局 */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 左侧栏 - Agent */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .logo-text {
            font-size: 15px;
            font-weight: 600;
        }
        
        /* Agent 列表 */
        .agents-section {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding: 0 8px;
        }
        
        .agent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.15s;
            cursor: pointer;
        }
        
        .agent-item:hover {
            background: var(--bg-hover);
        }
        
        .agent-item.active {
            background: rgba(59, 130, 246, 0.15);
        }
        
        .agent-item .task-count {
            margin-left: auto;
            font-size: 11px;
            background: var(--bg-hover);
            padding: 2px 6px;
            border-radius: 8px;
            color: var(--text-secondary);
        }
        
        .agent-item.active .task-count {
            background: var(--accent-blue);
            color: white;
        }
        
        .agent-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .agent-info {
            flex: 1;
            min-width: 0;
        }
        
        .agent-name {
            font-size: 13px;
            font-weight: 500;
        }
        
        .agent-role {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .agent-status {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .agent-status.idle { background: var(--text-secondary); }
        .agent-status.working { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
        
        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }
        
        /* 顶部 Header */
        .header {
            height: 56px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }
        
        .header-title {
            font-size: 15px;
            font-weight: 600;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        /* 统计 */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            flex-shrink: 0;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-num {
            font-size: 18px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .stat-item.total .stat-num { color: var(--accent-blue); }
        .stat-item.done .stat-num { color: var(--accent-green); }
        .stat-item.doing .stat-num { color: var(--accent-yellow); }
        .stat-item.pending .stat-num { color: var(--text-secondary); }
        
        /* 看板 */
        .board {
            flex: 1;
            overflow-x: auto;
            padding: 16px;
            background: var(--bg-dark);
        }
        
        .board-scroll {
            display: flex;
            gap: 12px;
            height: 100%;
            min-width: max-content;
        }
        
        .board-column {
            width: 260px;
            min-width: 260px;
            background: var(--bg-card);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
        }
        
        .column-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .column-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .column-count {
            background: var(--bg-hover);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .column-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        /* 任务卡片 */
        .task-card {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        
        .task-card:hover {
            border-color: var(--accent-blue);
        }
        
        .task-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .task-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .task-project {
            font-size: 11px;
            padding: 2px 6px;
            background: var(--bg-hover);
            border-radius: 4px;
            color: var(--text-secondary);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .task-agent {
            font-size: 11px;
            color: var(--accent-blue);
        }
        
        /* 空状态 */
        .empty-column {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-header h2 {
            font-size: 16px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        /* 详情 */
        .detail-row {
            display: flex;
            margin-bottom: 12px;
        }
        
        .detail-label {
            width: 60px;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        
        .detail-value {
            font-size: 13px;
            word-break: break-all;
        }
        
        /* 时间线 */
        .timeline {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .timeline-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .timeline-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .timeline-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-blue);
            margin-top: 5px;
            flex-shrink: 0;
        }
        
        .timeline-content {
            flex: 1;
            min-width:

            display: flex;
            justify-content: space-between;

        }
-bottom: 2px;
        }
        
        .timeline-agent {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-blue);
        }
        
        .timeline-time {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .timeline-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        /* 新建任务表单 */
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 左侧 Agent 栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <span class="logo-text">OpenClaw</span>
                </div>
            </div>
            
            <div class="agents-section">
                <div class="section-title">🤖 Agents</div>
                <div id="agents-list">
                    <!-- Agent 列表由 JS 渲染 -->
                </div>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main">
            <!-- 顶部 Header -->
            <header class="header">
                <div class="header-title" id="header-title">📋 全部任务</div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="refreshData()">🔄 刷新</button>
                    <button class="btn btn-primary" onclick="openNewTaskModal()">+ 新建任务</button>
                </div>
            </header>
            
            <!-- 统计栏 -->
            <div class="stats-bar">
                <div class="stat-item total">
                    <span class="stat-num" id="stat-total">0</span>
                    <span class="stat-label">总任务</span>
                </div>
                <div class="stat-item done">
                    <span class="stat-num" id="stat-done">0</span>
                    <span class="stat-label">已完成</span>
                </div>
                <div class="stat-item doing">
                    <span class="stat-num" id="stat-doing">0</span>
                    <span class="stat-label">进行中</span>
                </div>
                <div class="stat-item pending">
                    <span class="stat-num" id="stat-pending">0</span>
                    <span class="stat-label">待处理</span>
                </div>
            </div>
            
            <!-- 看板 -->
            <div class="board">
                <div class="board-scroll" id="board">
                    <!-- 看板列由 JS 渲染 -->
                </div>
            </div>
        </main>
    </div>
    
    <!-- 任务详情弹窗 -->
    <div class="modal" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">任务详情</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
            </div>
        </div>
    </div>
    
    <!-- 新建任务弹窗 -->
    <div class="modal" id="new-task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ 新建任务</h2>
                <button class="modal-close" onclick="closeNewTaskModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">任务名称 *</label>
                    <input type="text" class="form-input" id="new-task-name" placeholder="请输入任务名称">
                </div>
                <div class="form-group">
                    <label class="form-label">开发模式 *</label>
                    <select class="form-select" id="new-task-mode">
                        <option value="新功能">🚀 新功能</option>
                        <option value="Bug修复">🐛 Bug修复</option>
                        <option value="紧急热修">🔥 紧急热修</option>
                        <option value="重构优化">♻️ 重构优化</option>
                        <option value="数据迁移">🗄️ 数据迁移</option>
                        <option value="需求调研">🔬 需求调研</option>
                        <option value="其他">📌 其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">项目</label>
                    <input type="text" class="form-input" id="new-task-project" placeholder="请输入项目名称">
                </div>
                <div class="form-group">
                    <label class="form-label">描述</label>
                    <textarea class="form-textarea" id="new-task-desc" placeholder="请输入任务描述"></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeNewTaskModal()">取消</button>
                    <button class="btn btn-primary" onclick="createTask()">创建</button>
                </div>
            </div>
        </div>
    </div>

        let tasks = EMBEDDED_DATA;
        let filterAgent = null;
        
        // 加载任务 - 使用嵌入式数据
        function loadTasks() {
            tasks = EMBEDDED_DATA;
            renderAll();
        }
        
        // 渲染全部
        function renderAll() {
            renderStats();
            renderAgents();
            renderBoard();
        }
        
        // 渲染统计
        function renderStats() {
            let filtered = tasks;
            if (filterAgent) {
                filtered = tasks.filter(t => t.reports && t.reports.some(r => r.agent === filterAgent));
            }
            
            const total = filtered.length;
            const done = filtered.filter(t => t.status === 'done').length;
            const doing = filtered.filter(t => t.status && t.status !== 'done' && t.status !== 'pending').length;
            const pending = filtered.filter(t => !t.status || t.status === 'pending').length;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-doing').textContent = doing;
            document.getElementById('stat-pending').textContent = pending;
        }
        
        // 渲染 Agent
        function renderAgents() {
            const agentTaskCount = {};
            const agentWorking = {};
            
            tasks.forEach(task => {
                if (task.reports) {
                    const lastReport = task.reports[task.reports.length - 1];
                    if (lastReport) {
                        agentTaskCount[lastReport.agent] = (agentTaskCount[lastReport.agent] || 0) + 1;
                        if (task.status !== 'done') {
                            agentWorking[lastReport.agent] = true;
                        }
                    }
                }
            });
            
            const html = AGENTS.map(agent => {
                const isWorking = agentWorking[agent.id];
                const count = agentTaskCount[agent.id] || 0;
                return `
                    <div class="agent-item ${filterAgent === agent.id ? 'active' : ''}" onclick="filterByAgent('${agent.id}')">
                        <div class="agent-avatar" style="background: ${agent.color}20; color: ${agent.color}">
                            ${agent.name.charAt(0)}
                        </div>
                        <div class="agent-info">
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-role">${agent.role}</div>
                        </div>
                        <span class="task-count">${count}</span>
                        <div class="agent-status ${isWorking ? 'working' : 'idle'}"></div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('agents-list').innerHTML = html;
        }
        
        // 按 Agent 过滤
        function filterByAgent(agentId) {
            if (filterAgent === agentId) {
                filterAgent = null; // 取消过滤
                document.getElementById('header-title').textContent = '📋 全部任务';
            } else {
                filterAgent = agentId;
                const agent = AGENTS.find(a => a.id === agentId);
                document.getElementById('header-title').textContent = `📋 ${agent.name} 的任务`;
            }
            renderAll();
        }
        
        // 渲染看板
        function renderBoard() {
            let filtered = tasks;
            if (filterAgent) {
                filtered = tasks.filter(t => t.reports && t.reports.some(r => r.agent === filterAgent));
            }
            
            const html = COLUMNS.map(col => {
                const colTasks = filtered.filter(t => {
                    const mode = (t.mode || '其他');
                    return mode === col.mode;
                });
                
                const cards = colTasks.map(task => {
                    const lastReport = task.reports && task.reports.length > 0 ? task.reports[task.reports.length - 1] : null;
                    return `
                        <div class="task-card" onclick="showTask('${task.id}')">
                            <div class="task-title">${task.name}</div>
                            <div class="task-meta">
                                <span class="task-project">${task.project || '-'}</span>
                                ${lastReport ? `<span class="task-agent">@${lastReport.agent}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
                
                const emptyHtml = colTasks.length === 0 ? '<div class="empty-column">暂无任务</div>' : '';
                
                return `
                    <div class="board-column">
                        <div class="column-header">
                            <span class="column-title">${col.title}</span>
                            <span class="column-count">${colTasks.length}</span>
                        </div>
                        <div class="column-body">
                            ${cards}
                            ${emptyHtml}
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('board').innerHTML = html;
        }
        
        // 显示任务详情
        function showTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            document.getElementById('modal-title').textContent = task.name;
            
            const reports = task.reports || [];
            const timeline = reports.map(r => `
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-header">
                            <span class="timeline-agent">${r.agent}</span>
                            <span class="timeline-time">${r.time}</span>
                        </div>
                        <div class="timeline-text">${r.content}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('modal-body').innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">项目</span>
                    <span class="detail-value">${task.project || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">模式</span>
                    <span class="detail-value">${task.mode || '其他'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">分支</span>
                    <span class="detail-value">${task.branch || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">描述</span>
                    <span class="detail-value">${task.description || '-'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">创建</span>
                    <span class="detail-value">${task.createdAt || '-'}</span>
                </div>
                ${timeline ? `<div class="timeline"><div class="timeline-title">📝 执行记录</div>${timeline}</div>` : '<div class="empty-column">暂无记录</div>'}
            `;
            
            document.getElementById('task-modal').classList.add('show');
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('task-modal').classList.remove('show');
        }
        
        // 新建任务
        function openNewTaskModal() {
            document.getElementById('new-task-modal').classList.add('show');
        }
        
        function closeNewTaskModal() {
            document.getElementById('new-task-modal').classList.remove('show');
            // 清空表单
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-mode').value = '新功能';
            document.getElementById('new-task-project').value = '';
            document.getElementById('new-task-desc').value = '';
        }
        
        function createTask() {
            const name = document.getElementById('new-task-name').value.trim();
            const mode = document.getElementById('new-task-mode').value;
            const project = document.getElementById('new-task-project').value.trim();
            const description = document.getElementById('new-task-desc').value.trim();
            
            if (!name) {
                alert('请输入任务名称');
                return;
            }
            
            const newTask = {
                id: Date.now().toString(),
                name: name,
                mode: mode,
                status: 'pending',
                project: project,
                description: description,
                createdAt: new Date().toISOString().split('T')[0],
                reports: [],
                timeline: []
            };
            
            tasks.push(newTask);
            
            // 保存到 Gist
            saveTasks();
            
            closeNewTaskModal();
            renderAll();
        }

        // 保存任务 - GitHub Pages 版本不支持保存，请本地运行
        
        // 刷新数据
        function refreshData() {
            filterAgent = null;
            document.getElementById('header-title').textContent = '📋 全部任务';
            loadTasks();
        }
        
        // 关闭弹窗事件
        document.getElementById('task-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        document.getElementById('new-task-modal').addEventListener('click', function(e) {
            if (e.target === this) closeNewTaskModal();
        });
        
        // 初始化
        loadTasks();
        
        // 自动刷新
        setInterval(loadTasks, 30000);
    </script>
